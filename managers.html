<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サッカー名将の師弟関係</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap');
  :root {
    --bg: #0a0c10;
    --border: #1e2330;
    --accent-gold: #c9a84c;
    --text: #e8eaf0;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    padding: 28px 40px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    letter-spacing: 0.08em;
    color: var(--accent-gold);
    line-height: 1;
  }
  header p { font-size: 0.75rem; color: var(--muted); }
  .legend {
    display: flex;
    gap: 10px 14px;
    padding: 6px 14px 8px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
    max-height: 200px;
    overflow: hidden;
    transition: max-height .25s, padding .25s;
  }
  .legend.collapsed {
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-bottom: none;
  }
  .legend-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 14px;
    background: #0d1018;
    border-bottom: 1px solid var(--border);
    font-size: .65rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: .03em;
  }
  .legend-toggle::after {
    content: '▼';
    font-size: .55rem;
    transition: transform .2s;
  }
  .legend-toggle.collapsed::after { transform: rotate(-90deg); }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.62rem; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .canvas-wrap {
    width: 100%;
    height: calc(100vh - 120px);
    overflow: hidden;
    position: relative;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .canvas-wrap:active { cursor: grabbing; }
  svg { display: block; transform-origin: 0 0; }
  .node-group { cursor: default; }
  .node-card { transition: filter 0.18s; }
  .node-group:hover .node-card { filter: brightness(1.25) drop-shadow(0 0 8px rgba(200,168,76,0.3)); }

  /* Zoom controls */
  .zoom-controls {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 100;
  }
  .zoom-btn {
    width: 40px; height: 40px;
    background: #1a1e2a;
    border: 1px solid #2e3446;
    border-radius: 8px;
    color: #c9a84c;
    font-size: 1.3rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .zoom-btn:hover { background: #252b3b; }
  .zoom-btn:active { background: #2e3446; }
  .zoom-hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.68rem;
    color: #4b5563;
    pointer-events: none;
    letter-spacing: 0.04em;
  }
  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    fill: var(--muted);
  }
  .era-line { stroke: #1e2330; stroke-width: 1; stroke-dasharray: 4 4; }
  .edge { fill: none; stroke-width: 1.6; }
  .edge-label { font-size: 8.5px; fill: #4b5563; text-anchor: middle; font-family: 'Noto Sans JP', sans-serif; }

  /* ── Modal ── */
  #modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: #111520;
    border: 1px solid #2a3040;
    border-radius: 16px;
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.8);
    position: relative;
    animation: modalIn .18s ease;
  }
  @keyframes modalIn {
    from { opacity:0; transform:scale(.94) translateY(12px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }
  #modal-close {
    position: sticky; top: 0; float: right;
    margin: 12px 14px 0 0;
    background: #1e2330; border: none;
    color: #9ca3af; font-size: 1.2rem;
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #modal-close:hover { background:#2e3446; color:#fff; }
  #modal-header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid #1e2330;
  }
  #modal-header .m-nation { font-size: 2rem; margin-right: 10px; }
  #modal-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.7rem; letter-spacing: .06em;
    color: var(--accent-gold); margin: 0; display: inline;
  }
  #modal-header .m-en { font-size: .78rem; color: #6b7280; margin-top: 2px; }
  #modal-header .m-style { font-size: .76rem; color: #9ca3af; margin-top: 6px; line-height: 1.5; }
  #modal-body { padding: 14px 18px 20px; }
  .m-club-block { margin-bottom: 18px; }
  .m-club-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: .95rem; letter-spacing: .08em;
    padding: 4px 10px; border-radius: 6px;
    margin-bottom: 8px; display: inline-block;
  }
  .m-season-table { width: 100%; border-collapse: collapse; }
  .m-season-table th {
    font-size: .65rem; color: #6b7280; text-align: left;
    padding: 2px 6px; border-bottom: 1px solid #1e2330;
    font-weight: 400; letter-spacing: .05em;
  }
  .m-season-table td {
    font-size: .72rem; color: #d1d5db;
    padding: 4px 6px; border-bottom: 1px solid #151a24;
    vertical-align: top;
  }
  .m-season-table tr:last-child td { border-bottom: none; }
  .m-season-table .rank { color: #fff; font-weight: 700; }
  .m-season-table .rank.gold { color: #f59e0b; }
  .m-season-table .rank.silver { color: #94a3b8; }
  .m-season-table .cl { color: #a78bfa; }
  .m-season-table .trophy { color: #f59e0b; }
  .m-no-data { color: #4b5563; font-size: .72rem; font-style: italic; padding: 4px 6px; }

  /* ── Tab navigation ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: #0d1018;
    padding: 0 16px;
  }
  .tab-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: .07em;
    color: var(--muted);
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 10px 18px 9px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn.active { color: var(--accent-gold); border-bottom-color: var(--accent-gold); }
  .tab-btn:hover { color: #e8eaf0; }

  /* ── Stats page ── */
  #page-stats {
    display: none;
    height: calc(100vh - 120px);
    overflow-y: auto;
    padding: 10px 12px 40px;
    -webkit-overflow-scrolling: touch;
  }
  #page-stats.active { display: block; }
  #page-tree { display: block; }
  #page-tree.hidden { display: none; }

  /* ── Accordion cards ── */
  .ac-card {
    background: #111520;
    border: 1px solid #1e2330;
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .ac-card.open { border-color: var(--ac-c, #c9a84c); }
  .ac-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .ac-head::after {
    content: '▶';
    font-size: .65rem;
    color: #4b5563;
    margin-left: auto;
    flex-shrink: 0;
    transition: transform .22s, color .22s;
  }
  .ac-card.open .ac-head::after { transform: rotate(90deg); color: var(--ac-c, #c9a84c); }
  .ac-flag { font-size: 1.3rem; flex-shrink: 0; }
  .ac-info { flex: 1; min-width: 0; }
  .ac-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ac-status {
    font-size: .6rem;
    padding: 1px 7px;
    border-radius: 10px;
    border: 1px solid;
    font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .ac-name { font-weight: 700; font-size: .92rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-en   { font-size: .68rem; color: #6b7280; margin-top: 1px; }
  .ac-stats-row {
    display: flex;
    gap: 5px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .ac-stat-badge {
    font-size: .6rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid transparent;
    letter-spacing: .03em;
    white-space: nowrap;
  }
  .ac-badge {
    font-size: .65rem;
    background: #1a1e2c;
    border: 1px solid #2a3040;
    border-radius: 20px;
    padding: 2px 8px;
    color: #9ca3af;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ac-body {
    display: none;
    padding: 0 14px 14px;
    border-top: 1px solid #1a1f2e;
  }
  .ac-card.open .ac-body { display: block; }
  .ac-style {
    font-size: .71rem;
    color: #9ca3af;
    line-height: 1.55;
    padding: 9px 0 8px;
    border-bottom: 1px solid #1a1f2e;
    margin-bottom: 10px;
  }
  .ac-club-block { margin-bottom: 14px; }
  .ac-club-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: .85rem;
    letter-spacing: .05em;
    padding: 3px 9px;
    border-radius: 5px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .ac-table { width: 100%; border-collapse: collapse; font-size: .7rem; }
  .ac-table thead th {
    color: #4b5563; font-weight: 400; text-align: left;
    padding: 2px 5px 5px; border-bottom: 1px solid #1e2330;
    font-size: .62rem; letter-spacing: .04em;
  }
  .ac-table tbody tr { border-bottom: 1px solid #13172050; }
  .ac-table tbody tr:last-child { border-bottom: none; }
  .ac-table tbody td { padding: 5px 5px; vertical-align: top; color: #d1d5db; }
  .td-s  { color: #6b7280; white-space: nowrap; font-size:.68rem; }
  .td-p  { font-weight: 700; white-space: nowrap; }
  .td-p1 { color: #f59e0b; }
  .td-p2 { color: #94a3b8; }
  .td-p3 { color: #cd7c2a; }
  .td-ppg { color: #a78bfa; font-weight: 700; font-size: .68rem; }
  .td-cl { color: #a78bfa; }
  .td-cl.w {
    color: #fff;
    background: #aa0000;
    font-weight: 900;
    border-radius: 3px;
    padding: 1px 5px;
    text-shadow: 0 0 6px #ff000088;
    white-space: nowrap;
  }
  .td-note { color: #9ca3af; font-size:.68rem; }

  /* Sort bar */
  .sort-bar {
    position: sticky;
    top: 0;
    background: #0d1018;
    border-bottom: 1px solid #1e2330;
    padding: 8px 10px;
    margin: -10px -12px 8px;
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
    z-index: 5;
  }
  .sort-label {
    font-size: .65rem;
    color: #6b7280;
    margin-right: 2px;
    letter-spacing: .03em;
  }
  .sort-btn {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: .65rem;
    background: #1a1e2a;
    border: 1px solid #2a3040;
    color: #9ca3af;
    padding: 4px 9px;
    border-radius: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .sort-btn:active { background: #252b3b; }
  .sort-btn.cl-sort {
    background: #cc000022;
    border-color: #cc000088;
    color: #ff6b6b;
  }
  .sort-btn.cl-sort.active {
    background: #cc000044;
    border-color: #ff4444;
    color: #ff4444;
    box-shadow: 0 0 8px #ff000055;
  }
  .sort-btn.active {
    background: #c9a84c22;
    border-color: #c9a84c;
    color: #c9a84c;
    font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <h1>FOOTBALL MANAGER TREE</h1>
  <p>主要監督の師弟・影響関係図</p>
</header>
<nav class="tabs">
  <button class="tab-btn active" id="tab-tree" onclick="switchTab('tree')">🌐 関係図</button>
  <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')">📊 成績一覧</button>
</nav>

<div id="page-tree">
<div class="legend-toggle" id="legend-toggle" onclick="toggleLegend()">凡例を表示</div>
<div class="legend collapsed" id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#2ecc71"></div><span>ミケルス系（緑）</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div><span>サッキ系（青）</span></div>

  <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div><span>ファン・ハール系（紫）</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#64748b"></div><span>独立系（グレー）</span></div>
  <div class="legend-item" style="margin-left:8px"><span style="color:#c9a84c">──▶</span><span style="margin-left:4px">コーチ師弟</span></div>
  <div class="legend-item"><span style="color:#3498db">──▶</span><span style="margin-left:4px">選手として影響</span></div>
  <div class="legend-item"><span style="color:#9b59b6">──▶</span><span style="margin-left:4px">思想的影響</span></div>
</div>
<div class="canvas-wrap" id="canvas">
  <svg id="tree"></svg>
</div>
<div class="zoom-controls">
  <button class="zoom-btn" id="zoomIn" title="拡大">＋</button>
  <button class="zoom-btn" id="zoomReset" title="リセット" style="font-size:0.85rem">reset</button>
  <button class="zoom-btn" id="zoomOut" title="縮小">－</button>
</div>
<div class="zoom-hint">🖱 ホイール／ドラッグ で移動　📱 2本指ピンチで拡大縮小</div>
</div><!-- /page-tree -->

<div id="page-stats"><!-- populated by JS --></div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close">✕</button>
    <div id="modal-header"></div>
    <div id="modal-body"></div>
  </div>
</div>

const ROW_GAP = 1;
const SECTION_H = 14;

const SMALL_KEYS = new Set(['deschamps','conte','allegri','delbosque','martinez_r','amorim']);
function getNodeW(m) {
  if (m === managers.pep) return NW_PEP;
  const k = Object.keys(managers).find(k => managers[k] === m);
  if (SMALL_KEYS.has(k)) return NW_SMALL;
  return NW;
}

function nodeHeight(m) {
  let h = NH_BASE;
  if (m.coaching.length > 0) h += SECTION_H + m.coaching.length * (ROW_H + ROW_GAP);
  if (m.managing.length > 0) {
    h += SECTION_H;
    m.managing.forEach(row => {
      h += ROW_H + ROW_GAP;
      if (row.trophies || row.clWin) h += TROPHY_H;
    });
    h += 2;
  }
  h += 10;
  return h;
}

// PAN & ZOOM  ── CSS transform方式（滑らか）
const canvas = document.getElementById("canvas");

const INIT_SCALE = 0.52;
const PEP_X = managers.pep.x;
const PEP_Y = managers.pep.y + managers.pep._h / 2;
const MIN_SCALE = 0.12, MAX_SCALE = 3.0;

let scale = INIT_SCALE;
let tx = 0, ty = 0;

function applyTransform() {
  svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  svg.style.transformOrigin = "0 0";
}

function centerOnPep() {
  const cw = canvas.clientWidth  || window.innerWidth;
  const ch = canvas.clientHeight || (window.innerHeight - 130);
  tx = cw / 2 - PEP_X * scale;
  ty = ch / 2 - PEP_Y * scale;
}

requestAnimationFrame(() => { centerOnPep(); applyTransform(); });

// ── Mouse drag ──
let mdDown = false, mdMoved = false, mdLastX = 0, mdLastY = 0;

canvas.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  mdDown = true; mdMoved = false;
  mdLastX = e.clientX; mdLastY = e.clientY;
  canvas.style.cursor = "grabbing";
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!mdDown) return;
  const dx = e.clientX - mdLastX, dy = e.clientY - mdLastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) mdMoved = true;
  tx += dx; ty += dy;
  mdLastX = e.clientX; mdLastY = e.clientY;
  applyTransform();
});
window.addEventListener("mouseup", () => {
  mdDown = false;
  canvas.style.cursor = "grab";
});

// ── Mouse wheel zoom ──
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const ns = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns;
  applyTransform();
}, { passive: false });

// ── Touch: 1本指パン + 2本指ピンチ ──
let t1x = 0, t1y = 0;          // 前フレームの指1位置
let pinchDist = 0;              // 前フレームのピンチ距離
let pinchMx = 0, pinchMy = 0;  // 前フレームのピンチ中点

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    t1x = e.touches[0].clientX;
    t1y = e.touches[0].clientY;
    pinchDist = 0;
  } else if (e.touches.length >= 2) {
    const a = e.touches[0], b = e.touches[1];
    pinchDist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    pinchMx = (a.clientX + b.clientX) / 2;
    pinchMy = (a.clientY + b.clientY) / 2;
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const cx = e.touches[0].clientX, cy = e.touches[0].clientY;
    tx += cx - t1x;
    ty += cy - t1y;
    t1x = cx; t1y = cy;
    applyTransform();
  } else if (e.touches.length >= 2) {
    const a = e.touches[0], b = e.touches[1];
    const dist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    const mx = (a.clientX + b.clientX) / 2;
    const my = (a.clientY + b.clientY) / 2;
    const rect = canvas.getBoundingClientRect();
    const px = mx - rect.left, py = my - rect.top;

    // ズーム
    if (pinchDist > 0) {
      const factor = dist / pinchDist;
      const ns = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
      tx = px - (px - tx) * (ns / scale);
      ty = py - (py - ty) * (ns / scale);
      scale = ns;
    }
    // パン（中点の移動）
    tx += mx - pinchMx;
    ty += my - pinchMy;

    pinchDist = dist;
    pinchMx = mx; pinchMy = my;
    applyTransform();
  }
}, { passive: false });

canvas.addEventListener("touchend", e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    // 2本指→1本指に戻った時、その指を再初期化
    t1x = e.touches[0].clientX;
    t1y = e.touches[0].clientY;
    pinchDist = 0;
  } else if (e.touches.length === 0) {
    pinchDist = 0;
  }
}, { passive: false });

// ── Zoom buttons ──
document.getElementById("zoomIn").addEventListener("click", () => {
  const cx = canvas.clientWidth/2, cy = canvas.clientHeight/2;
  const ns = Math.min(MAX_SCALE, scale * 1.35);
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; applyTransform();
});
document.getElementById("zoomOut").addEventListener("click", () => {
  const cx = canvas.clientWidth/2, cy = canvas.clientHeight/2;
  const ns = Math.max(MIN_SCALE, scale / 1.35);
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; applyTransform();
});
document.getElementById("zoomReset").addEventListener("click", () => {
  scale = INIT_SCALE; centerOnPep(); applyTransform();
});

  const tog = document.getElementById('legend-toggle');
  const open = leg.classList.toggle('collapsed');
  tog.classList.toggle('collapsed');
  tog.firstChild.nodeValue = open ? '凡例を表示' : '凡例を隠す';
}

// TAB SWITCH
function switchTab(tab) {
  const isTree = tab === 'tree';
  document.getElementById('page-tree').classList.toggle('hidden', !isTree);
  document.getElementById('page-stats').classList.toggle('active', !isTree);
  document.getElementById('tab-tree').classList.toggle('active', isTree);
  document.getElementById('tab-stats').classList.toggle('active', !isTree);
  if (!isTree && !document.getElementById('page-stats').dataset.built) {
    buildStats();
    document.getElementById('page-stats').dataset.built = '1';
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SORT
let currentSort = 'mgrStart-asc';
function sortStats(mode) {
  currentSort = mode;
  const sorters = {
    'mgrStart-asc':  (a,b) => a.mgrStart - b.mgrStart,
    'mgrStart-desc': (a,b) => b.mgrStart - a.mgrStart,
    'born-asc':      (a,b) => parseInt(a.born) - parseInt(b.born),
    'born-desc':     (a,b) => parseInt(b.born) - parseInt(a.born),
    'ppg-desc':      (a,b) => b.ppg - a.ppg,
    'ppg-asc':       (a,b) => a.ppg - b.ppg,
    'wp-desc':       (a,b) => b.wp - a.wp,
    'wp-asc':        (a,b) => a.wp - b.wp,
    'cl-desc':       (a,b) => (b.clWins||0) - (a.clWins||0) || (b.clRunnerUp||0) - (a.clRunnerUp||0) || b.ppg - a.ppg,
  };
  statsData.sort(sorters[mode] || sorters['mgrStart-asc']);
  // 並べ替えボタンUIの選択状態更新
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.sort === mode);
  });
  // リスト再構築
  const c = document.getElementById('page-stats');
  // ソートバー以外をクリア
  const cards = c.querySelectorAll('.ac-card');
  cards.forEach(card => card.remove());
  buildStatsCards();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BUILD STATS PAGE
function buildStats() {
  const container = document.getElementById('page-stats');
  // ソートバー
  const sortBar = document.createElement('div');
  sortBar.className = 'sort-bar';
  sortBar.innerHTML = `
    <span class="sort-label">並び替え:</span>
    <button class="sort-btn active" data-sort="mgrStart-asc" onclick="sortStats('mgrStart-asc')">監督業 古い順</button>
    <button class="sort-btn" data-sort="mgrStart-desc" onclick="sortStats('mgrStart-desc')">監督業 新しい順</button>
    <button class="sort-btn" data-sort="born-asc" onclick="sortStats('born-asc')">年齢 高い順</button>
    <button class="sort-btn" data-sort="born-desc" onclick="sortStats('born-desc')">年齢 低い順</button>
    <button class="sort-btn" data-sort="ppg-desc" onclick="sortStats('ppg-desc')">PPG 高い順</button>
    <button class="sort-btn" data-sort="wp-desc" onclick="sortStats('wp-desc')">勝率 高い順</button>
    <button class="sort-btn cl-sort" data-sort="cl-desc" onclick="sortStats('cl-desc')">🏆 CL優勝数</button>
  `;
  container.appendChild(sortBar);
  buildStatsCards();
}

function buildStatsCards() {
  const container = document.getElementById('page-stats');
  statsData.forEach(m => {
    const card = document.createElement('div');
    card.className = 'ac-card';
    card.style.setProperty('--ac-c', m.color);

    // ヘッダー（常時表示）
    const head = document.createElement('div');
    head.className = 'ac-head';
    const statusColors = {
      active:  {bg:'#16a34a22', bd:'#16a34a', fg:'#4ade80', icon:'●'},
      free:    {bg:'#3b82f622', bd:'#3b82f6', fg:'#60a5fa', icon:'○'},
      rest:    {bg:'#f59e0b22', bd:'#f59e0b', fg:'#fbbf24', icon:'⏸'},
      retired: {bg:'#64748b22', bd:'#64748b', fg:'#9ca3af', icon:'■'},
    };
    const sc = statusColors[m.status] || statusColors.retired;
    head.innerHTML = `
      <span class="ac-flag">${m.flag}</span>
      <div class="ac-info">
        <div class="ac-name-row">
          <span class="ac-name">${m.name}</span>
          <span class="ac-status" style="background:${sc.bg};border-color:${sc.bd};color:${sc.fg}">${sc.icon} ${m.statusLabel}</span>
        </div>
        <div class="ac-en">${m.en}</div>
        <div class="ac-stats-row">
          <span class="ac-stat-badge" style="background:${m.color}22;border-color:${m.color}55;color:${m.color}">勝率 ${m.wp}%</span>
          <span class="ac-stat-badge" style="background:#1a1f2e;border-color:#2a3040;color:#a78bfa">PPG ${m.ppg}</span>
          ${m.clWins > 0 ? `<span class="ac-stat-badge cl-badge" style="background:#cc000033;border-color:#cc0000;color:#ff4444;font-weight:900;text-shadow:0 0 6px #ff000066">🏆 CL×${m.clWins}</span>` : ''}
          ${m.clRunnerUp > 0 ? `<span class="ac-stat-badge" style="background:#7c2d1222;border-color:#7c2d12;color:#fdba74">🥈 準優勝×${m.clRunnerUp}</span>` : ''}
          <span class="ac-stat-badge" style="background:#1a1f2e;border-color:#2a3040;color:#6b7280">${m.matches}試</span>
        </div>
      </div>
      <span class="ac-badge">${m.mgrStart}年〜</span>
    `;

    // ボディ（タップで表示）
    const body = document.createElement('div');
    body.className = 'ac-body';

    const styleDiv = document.createElement('div');
    styleDiv.className = 'ac-style';
    styleDiv.textContent = m.style;
    body.appendChild(styleDiv);

    m.clubs.forEach(club => {
      const block = document.createElement('div');
      block.className = 'ac-club-block';

      const title = document.createElement('div');
      title.className = 'ac-club-name';
      const isNat = /代表|National|national/.test(club.name);
      title.style.cssText = isNat
        ? `color:#4ade80;background:#4ade8022`
        : `color:${m.color};background:${m.color}22`;
      title.innerHTML = club.name + (club.ppg ? ` <span style="font-size:.65rem;color:#a78bfa;margin-left:6px;letter-spacing:0">PPG ${club.ppg}</span>` : '');
      block.appendChild(title);

      const table = document.createElement('table');
      table.className = 'ac-table';
      table.innerHTML = `<thead><tr><th>年</th><th>順位</th><th>PPG</th><th>CL</th><th>備考</th></tr></thead>`;
      const tbody = document.createElement('tbody');

      club.seasons.forEach(s => {
        const tr = document.createElement('tr');
        const p = s.pos;
        const clWin = s.cl.includes('優勝');
        tr.innerHTML = `
          <td class="td-s">${s.s}</td>
          <td class="td-p ${p==='1'||p==='1(C)'?'td-p1':p==='2'?'td-p2':p==='3'?'td-p3':''}">${p}位</td>
          <td class="td-ppg">${s.ppg ? s.ppg : '—'}</td>
          <td class="td-cl ${clWin?'w':''}">${s.cl}</td>
          <td class="td-note">${s.note}</td>
        `;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      block.appendChild(table);
      body.appendChild(block);
    });

    card.appendChild(head);
    card.appendChild(body);

    // タップでアコーディオン開閉
    head.addEventListener('click', () => {
      const wasOpen = card.classList.contains('open');
      card.classList.toggle('open', !wasOpen);
      if (!wasOpen) {
        setTimeout(() => card.scrollIntoView({behavior:'smooth', block:'nearest'}), 40);
      }
    });

    container.appendChild(card);
  });
}

</script>
